name: build manga-ocr
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - manga-ocr/**
jobs:
  push:
    name: "unsdockers:manga-ocr_${{ matrix.tag }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        tag:
          - ocr-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./manga-ocr
          file: ./manga-ocr/${{ matrix.tag }}/Dockerfile
          # so amd64: o(s) node(s) de producao sao x86_64, e um build
          # multi-arch com PyTorch (manga-ocr + easyocr) fica pesado demais
          # emulando arm64 via QEMU no runner do CI pra algo que nunca roda ali
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/blast-gm/unsdockers:manga-ocr_${{ matrix.tag }}
            ghcr.io/blast-gm/unsdockers:manga-ocr_${{ matrix.tag }}_${{ github.sha }}
